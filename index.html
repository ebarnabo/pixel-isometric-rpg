<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>L'Éclat de la Persécution — RPG Isométrique</title>
<style>
:root { --bg:#0f0f14; --panel:#1a1a22ee; --gold:#f0c14b; --purple:#a855f7; --green:#22c55e; }
body { margin:0; background:var(--bg); color:#e5e7eb; font-family:Inter,system-ui,sans-serif; overflow:hidden; }
canvas { display:block; width:100%; height:100vh; }
.ui-panel { position:absolute; background:var(--panel); border-radius:24px; padding:24px; backdrop-filter:blur(12px); }
#hud { top:16px; left:16px; }
.bar { width:200px; height:16px; background:#111; border-radius:8px; overflow:hidden; margin:4px 0; }
.bar-fill { height:100%; }
.hp { background:#ef4444; }
.mp { background:#3b82f6; }
#itemPanel { top:80px; right:16px; width:340px; display:none; }
.item-header { color:var(--gold); font-weight:800; font-size:1.4rem; }
.stat.primary { color:#c084fc; }
.stat.bonus { color:var(--green); }
#dialogue { bottom:100px; left:50%; transform:translateX(-50%); width:60%; display:none; text-align:center; }
button { background:linear-gradient(135deg,var(--gold),#d4a017); border:none; border-radius:16px; padding:12px 24px; font-weight:700; cursor:pointer; }
#inventoryToggle { position:absolute; top:16px; right:16px; width:48px; height:48px; border-radius:50%; background:#222; color:var(--gold); border:1px solid #444; }
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<div id="hud" class="ui-panel">
  <strong style="color:var(--gold)">KAEL</strong>
  <div class="bar"><div class="bar-fill hp" id="hpBar" style="width:100%"></div></div>
  <div class="bar"><div class="bar-fill mp" id="mpBar" style="width:100%"></div></div>
</div>
<div id="itemPanel" class="ui-panel">
  <div class="item-header">PERSECUTION</div>
  <div style="color:var(--purple); font-size:0.75rem;">ANCIENT LEGENDARY</div>
  <div style="font-size:2rem; font-weight:800;">2,155.4 DPS</div>
  <div class="stat primary">+1356–1538 DAMAGE</div>
  <div class="stat primary">CRITICAL DAMAGE +75%</div>
  <div class="stat bonus">+255 ALL RESISTANCES</div>
  <button id="equipBtn">Équiper</button>
</div>
<div id="dialogue" class="ui-panel">
  <p id="dialogueText"></p>
  <button id="dialogueNext">Continuer</button>
</div>
<button id="inventoryToggle">📦</button>
<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
function resize(){ canvas.width=window.innerWidth; canvas.height=window.innerHeight; }
window.addEventListener('resize', resize); resize();
const TILE_W=64, TILE_H=32;
function toScreen(x,y){ return { x:(x-y)*(TILE_W/2)+canvas.width/2, y:(x+y)*(TILE_H/2)+80 }; }
const player = { x:5, y:5, hp:230, maxHp:230, mp:350, maxMp:350 };
const npcs = [{ x:3, y:4, dialogues:["Kael ! Les visions de la Thief's Fang ne sont pas un hasard.", "Seule l'épée Persecution peut sceller la malédiction.", "Tue 5 ombres à l'est et reviens."] }];
const enemies = [{x:12,y:8,hp:80,alive:true},{x:14,y:10,hp:80,alive:true},{x:10,y:12,hp:100,alive:true}];
let particles=[], currentNpc=null, dialogueIndex=0, questProgress=0, inventoryOpen=false;
const keys={};
window.addEventListener('keydown', e=>keys[e.key.toLowerCase()]=true);
window.addEventListener('keyup', e=>keys[e.key.toLowerCase()]=false);
canvas.addEventListener('click', ()=>{
  const nearest = enemies.find(en=>en.alive && Math.hypot(en.x-player.x, en.y-player.y)<3);
  if(nearest){
    nearest.hp -= 140;
    spawnParticles(nearest.x, nearest.y);
    if(nearest.hp<=0){ nearest.alive=false; questProgress++; }
  }
});
function spawnParticles(tx,ty){
  const p=toScreen(tx,ty);
  for(let i=0;i<15;i++) particles.push({x:p.x,y:p.y,vx:(Math.random()-0.5)*5,vy:(Math.random()-0.5)*5-2,life:1,color:'#f97316'});
}
document.getElementById('dialogueNext').onclick = ()=>{
  if(!currentNpc) return;
  dialogueIndex++;
  if(dialogueIndex >= currentNpc.dialogues.length){
    document.getElementById('dialogue').style.display='none'; currentNpc=null;
  } else document.getElementById('dialogueText').textContent = currentNpc.dialogues[dialogueIndex];
};
function talk(npc){ currentNpc=npc; dialogueIndex=0; document.getElementById('dialogueText').textContent=npc.dialogues[0]; document.getElementById('dialogue').style.display='block'; }
document.getElementById('inventoryToggle').onclick = ()=>{
  inventoryOpen=!inventoryOpen;
  document.getElementById('itemPanel').style.display = inventoryOpen ? 'block' : 'none';
};
document.getElementById('equipBtn').onclick = ()=> alert('Persecution équipée. Puissance ancestrale activée.');
function update(){
  let dx=0, dy=0;
  if(keys.w||keys.arrowup) dy=-0.07;
  if(keys.s||keys.arrowdown) dy=0.07;
  if(keys.a||keys.arrowleft) dx=-0.07;
  if(keys.d||keys.arrowright) dx=0.07;
  player.x = Math.max(0, Math.min(19, player.x+dx));
  player.y = Math.max(0, Math.min(19, player.y+dy));
  npcs.forEach(npc=>{
    if(Math.hypot(npc.x-player.x, npc.y-player.y)<1.6 && keys.e && !currentNpc) talk(npc);
  });
  particles.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.life-=0.02; });
  particles = particles.filter(p=>p.life>0);
  document.getElementById('hpBar').style.width = (player.hp/player.maxHp*100)+'%';
}
function drawTile(x,y){
  const p=toScreen(x,y);
  ctx.beginPath();
  ctx.moveTo(p.x, p.y);
  ctx.lineTo(p.x+TILE_W/2, p.y+TILE_H/2);
  ctx.lineTo(p.x, p.y+TILE_H);
  ctx.lineTo(p.x-TILE_W/2, p.y+TILE_H/2);
  ctx.closePath();
  ctx.fillStyle = (x>4 && x<10 && y>2 && y<7) ? '#4a5568' : '#2d5a27';
  ctx.fill();
}
function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  for(let y=0;y<20;y++) for(let x=0;x<20;x++) drawTile(x,y);
  npcs.forEach(npc=>{ const p=toScreen(npc.x,npc.y); ctx.fillStyle='#b45309'; ctx.fillRect(p.x-12,p.y-30,24,30); });
  enemies.forEach(en=>{ if(!en.alive) return; const p=toScreen(en.x,en.y); ctx.fillStyle='#1e1b4b'; ctx.beginPath(); ctx.arc(p.x,p.y-10,12,0,Math.PI*2); ctx.fill(); });
  const pp=toScreen(player.x,player.y);
  ctx.fillStyle='#d97706'; ctx.fillRect(pp.x-8,pp.y-28,16,8);
  ctx.fillStyle='#92400e'; ctx.fillRect(pp.x-10,pp.y-20,20,24);
  ctx.strokeStyle='#e5e7eb'; ctx.beginPath(); ctx.moveTo(pp.x+12,pp.y-10); ctx.lineTo(pp.x+28,pp.y-22); ctx.stroke();
  particles.forEach(p=>{ ctx.globalAlpha=p.life; ctx.fillStyle=p.color; ctx.beginPath(); ctx.arc(p.x,p.y,4*p.life,0,Math.PI*2); ctx.fill(); ctx.globalAlpha=1; });
}
function loop(){ update(); draw(); requestAnimationFrame(loop); }
loop();
</script>
</body>
</html>
